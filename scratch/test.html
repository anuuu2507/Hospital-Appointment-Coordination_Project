<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; }
  .wrapper {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: navy;
    overflow-y: auto;
    padding: 2rem;
    box-sizing: border-box;
  }
  .wrapper::before,
  .wrapper::after {
    content: '';
    margin: auto;
  }
  .card {
    background: white;
    width: 300px;
    height: 1200px;
    flex-shrink: 0;
    margin: 0 auto;
  }
  .card-small {
    background: white;
    width: 300px;
    height: 200px;
    flex-shrink: 0;
    margin: 0 auto;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="card">Tall Card (Scrollable, starts at top!)</div>
  </div>
  <!-- <div class="wrapper">
    <div class="card-small">Small Card (Centered!)</div>
  </div> -->
</body>
</html>
