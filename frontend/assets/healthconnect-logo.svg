<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Subtle crisp shadow for dark mode or card placement -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F2747" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Transparent background container -->
  <rect width="520" height="140" fill="transparent" />

  <!-- ==================== ICON MARK (Left) ==================== -->
  <g transform="translate(15, 20)" filter="url(#softShadow)">
    <!-- Base Icon Card / App Tile -->
    <rect width="100" height="100" rx="22" fill="#0F2747" />

    <!-- Network Node 1 (Top Left) -->
    <circle cx="35" cy="35" r="7" fill="#0F9D8A" />
    <!-- Network Node 2 (Top Right - AI Sparkle node) -->
    <circle cx="65" cy="35" r="5" fill="#FFFFFF" opacity="0.9" />
    <!-- Network Node 3 (Bottom Left - Calendar/Time node) -->
    <circle cx="35" cy="65" r="5" fill="#FFFFFF" opacity="0.7" />
    <!-- Network Node 4 (Bottom Right - Connection node) -->
    <circle cx="65" cy="65" r="7" fill="#0F9D8A" />

    <!-- Connecting Paths / Neural Grid / Plus Symbol Integration -->
    <!-- Horizontal connection line forming the cross beam -->
    <line x1="35" y1="50" x2="65" y2="50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <!-- Vertical connection line forming the cross stem & calendar grid -->
    <line x1="50" y1="35" x2="50" y2="65" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Diagonal tech/data link overlay -->
    <line x1="35" y1="35" x2="65" y2="65" stroke="#0F9D8A" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round" opacity="0.6" />

    <!-- AI Data Sparkle Accent -->
    <path d="M 68 22 Q 72 22 72 18 Q 72 22 76 22 Q 72 22 72 26 Q 72 22 68 22 Z" fill="#0F9D8A" />
  </g>

  <!-- ==================== TYPOGRAPHY (Right) ==================== -->
  <g transform="translate(135, 0)">
    <!-- Brand Name: HealthConnect -->
    <text x="0" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="700" font-size="36" fill="#0F2747" letter-spacing="-0.8">
      Health<tspan fill="#0F9D8A" font-weight="600">Connect</tspan>
    </text>

    <!-- Tagline / Context -->
    <text x="2" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="500" font-size="11.5" fill="#526581" letter-spacing="1.8">
      AI-POWERED HOSPITAL APPOINTMENT COORDINATION
    </text>
  </g>
</svg>