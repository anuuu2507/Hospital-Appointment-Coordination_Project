<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Appointment Booking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f8;height:100vh;display:flex;align-items:center;justify-content:center}
.login-container{background:#fff;padding:2.5rem;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);width:100%;max-width:400px}
.login-container h1{text-align:center;color:#1a73e8;margin-bottom:.5rem;font-size:1.5rem}
.login-container p.sub{text-align:center;color:#666;margin-bottom:1.5rem;font-size:.9rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;margin-bottom:.3rem;color:#333;font-weight:500;font-size:.85rem}
.form-group input{width:100%;padding:.7rem;border:1px solid #ddd;border-radius:8px;font-size:.95rem;transition:border .2s}
.form-group input:focus{outline:none;border-color:#1a73e8}
button{width:100%;padding:.75rem;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;transition:background .2s}
button:hover{background:#1557b0}
.error{color:#d32f2f;text-align:center;margin-bottom:1rem;font-size:.85rem;display:none}
.chat-container{display:none;flex-direction:column;height:100vh;width:100%;max-width:800px;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.1)}
.chat-header{background:#1a73e8;color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.chat-header h2{font-size:1.1rem}
.chat-header .user-info{display:flex;align-items:center;gap:1rem}
.chat-header .user-info span{font-size:.85rem;opacity:.9}
.chat-header button{width:auto;padding:.4rem .8rem;font-size:.8rem;background:rgba(255,255,255,.2);border-radius:6px}
.chat-header button:hover{background:rgba(255,255,255,.3)}
.chat-messages{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem}
.message{max-width:75%;padding:.8rem 1rem;border-radius:12px;font-size:.9rem;line-height:1.5;white-space:pre-wrap}
.message.user{align-self:flex-end;background:#1a73e8;color:#fff;border-bottom-right-radius:4px}
.message.agent{align-self:flex-start;background:#f1f3f4;color:#333;border-bottom-left-radius:4px}
.typing{align-self:flex-start;color:#888;font-size:.85rem;padding:.5rem}
.chat-input{display:flex;padding:1rem;border-top:1px solid #eee;gap:.5rem}
.chat-input input{flex:1;padding:.7rem;border:1px solid #ddd;border-radius:8px;font-size:.95rem}
.chat-input input:focus{outline:none;border-color:#1a73e8}
.chat-input button{width:auto;padding:.7rem 1.5rem;border-radius:8px}
.chat-input button:disabled{background:#ccc;cursor:not-allowed}
</style>
</head>
<body>

<div class="login-container" id="loginScreen">
  <h1>Hospital Appointment Booking</h1>
  <p class="sub">Sign in to chat with the assistant</p>
  <div class="error" id="loginError"></div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
  </div>
  <button onclick="doLogin()">Sign In</button>
</div>

<div class="chat-container" id="chatScreen">
  <div class="chat-header">
    <h2>Hospital Booking Assistant</h2>
    <div class="user-info">
      <span id="userDisplay"></span>
      <button onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()" id="sendBtn">Send</button>
  </div>
</div>

<script>
let token = null;
let userName = '';
let userRole = '';

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  if (!email || !password) {
    errEl.textContent = 'Please enter email and password.';
    errEl.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.detail || 'Login failed');
    }
    const data = await res.json();
    token = data.token;
    userName = data.name;
    userRole = data.role;
    showChat();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function doLogout() {
  try {
    await fetch('/api/logout', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token}
    });
  } catch (e) {}
  token = null;
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('messages').innerHTML = '';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}

function showChat() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('userDisplay').textContent = userName + ' (' + userRole + ')';
  addMessage('agent', 'Hello ' + userName + '! I can help you book appointments, check doctor availability, and manage your schedule. How can I help you today?');
  document.getElementById('userInput').focus();
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  addMessage('user', text);

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  const typingDiv = document.createElement('div');
  typingDiv.className = 'typing';
  typingDiv.textContent = 'Thinking...';
  typingDiv.id = 'typing';
  document.getElementById('messages').appendChild(typingDiv);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({message: text})
    });

    const typingEl = document.getElementById('typing');
    if (typingEl) typingEl.remove();

    if (res.status === 401) {
      addMessage('agent', 'Your session has expired. Please log in again.');
      setTimeout(doLogout, 2000);
      return;
    }

    if (!res.ok) {
      addMessage('agent', 'Sorry, something went wrong. Please try again.');
      return;
    }

    const data = await res.json();
    addMessage('agent', data.reply);
  } catch (e) {
    const typingEl = document.getElementById('typing');
    if (typingEl) typingEl.remove();
    addMessage('agent', 'Network error. Please check your connection.');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
